name: AWS Lambda & Terragrunt CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & run unit tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3
          make test

      - name: Detect changed lambda directories
        id: changed-lambdas
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
            AFTER="${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
            AFTER="HEAD"
          fi

          echo "Diffing range: $BEFORE .. $AFTER"
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" \
            | grep "^lambdas/.*\.py$" | grep -v "/test_" | cut -d '/' -f2 | sort -u | tr '\n' ' ' | xargs)
          echo "Changed lambdas: '$CHANGED'"
          echo "changed-lambdas=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Build and zip Lambda packages
        if: steps.changed-lambdas.outputs.changed-lambdas != ''
        run: |
          for lambda_name in ${{ steps.changed-lambdas.outputs.changed-lambdas }}; do
            echo "Building $lambda_name"
            LAMBDA_DIR="lambdas/$lambda_name"

            # Zip only handler .py files, exclude test_* files
            ZIP_FILE="$GITHUB_WORKSPACE/$LAMBDA_DIR/lambda-function.zip"
            (cd "$LAMBDA_DIR" && zip "$ZIP_FILE" $(find . -maxdepth 1 -name "*.py" ! -name "test_*.py" -type f | sed 's|^./||'))
            echo "Created $LAMBDA_DIR/lambda-function.zip"
          done

      # Runs only on PRs — not workflow_dispatch
      - name: Commit and push zip packages to repo
        if: >-
          steps.changed-lambdas.outputs.changed-lambdas != '' &&
          github.event_name == 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for lambda_name in ${{ steps.changed-lambdas.outputs.changed-lambdas }}; do
            git add "lambdas/$lambda_name/lambda-function.zip"
          done

          if git diff --cached --quiet; then
            echo "No zip changes to commit"
          else
            git commit -m "ci: update Lambda zip packages [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Upload Lambda packages as artifact
        if: steps.changed-lambdas.outputs.changed-lambdas != ''
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: lambdas/**/*.zip
          retention-days: 7
