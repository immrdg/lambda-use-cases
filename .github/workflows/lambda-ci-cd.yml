name: AWS Lambda & Terragrunt CI/CD Pipeline

on:
  push:
    branches: [ main, master, "feat/**", "infra/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-test-and-package:
    name: Test, Package & Push Lambda Zip to Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        run: |
          for dir in lambda/*/; do
            if [ -d "$dir" ]; then
              echo "Testing Lambda module: $dir"
              python -m unittest discover -s "$dir"
            fi
          done

      - name: Build & Package Lambda Zip (Deterministic)
        run: |
          for dir in lambda/*/; do
            if [ -d "$dir" ]; then
              func_name=$(basename "$dir")
              echo "Packaging Lambda: $func_name deterministically"
              (cd "$dir" && find . -type f -not -name "*.zip" -exec touch -t 202601010000.00 {} + && zip -X -r -D "lambda-function.zip" . -x "*test*" "*.pyc" "*__pycache__*" "*.zip")
            fi
          done

      - name: Commit and Push Zip to Branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build(ci): update compiled lambda-function.zip artifact [skip ci]"
          file_pattern: "lambda/**/lambda-function.zip"
          add_options: "-f"

  terragrunt-validate:
    name: Validate Terraform & Terragrunt HCL
    runs-on: ubuntu-latest
    needs: python-test-and-package
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: 0.55.0

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive Infrastructure/

      - name: Validate Infrastructure App
        run: |
          (cd Infrastructure/app && terraform init -backend=false && terraform validate)

      - name: Terragrunt HCL Format Check
        run: |
          terragrunt hclfmt --terragrunt-check Infrastructure/env/ || echo "Terragrunt hclfmt check completed."
